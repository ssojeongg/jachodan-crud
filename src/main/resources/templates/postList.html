<h2>Hello Template</h2>

<table>
    <thead>
    <tr>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="post, index : ${postList}">
<!--        <td th:text="${post.post_title}"></td>-->
        <td>
            <a th:href="@{|/post/detail/${post.post_id}|}" th:text="${post.post_title}"></a>
        </td>

        <td th:text="${post.created_at}"></td>
    </tr>
    </tbody>
</table>

<button>
    <a th:href="@{/post/new}">등록하기</a>
</button>
