<nav th:fragment="navbarFragment"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">SBB</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <!-- 로그인 전: 로그인 링크 -->
        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" th:href="@{/user/login}">로 그 인</a>
        </li>

        <!-- 로그인 후: POST 로그아웃 버튼 -->
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/user/logout}" method="post" class="m-0 d-flex align-items-center">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-link nav-link px-2 py-2 m-0 border-0 bg-transparent">로그아웃</button>
          </form>
        </li>

        <li class="nav-item">
          <a class="nav-link" th:href="@{/user/signup}">회 원 가 입</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
