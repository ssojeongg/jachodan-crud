spring:
  profiles: dev
  datasource:
    url: jdbc:h2:~/local
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # create / update / validate 등 필요에 맞게 선택
    show-sql: true
  h2:
    console:
      enabled: true       # 웹 콘솔 사용
      path: /h2-console   # 접속 경로 (기본값 /h2-console)
logging:
  level:
    root: DEBUG